# ============================================================
# 灵眸电商AI中台 — 统一 Docker Compose
# ============================================================
# 用法:
#   docker compose up -d              # 启动全部 (后台)
#   docker compose up -d --build      # 重新构建 + 启动
#   docker compose down               # 停止全部
#   docker compose logs -f p1-backend # 查看某个服务日志
#
# 端口:
#   ① 智能客服助手:     前端 3001  后端 8101
#   ② 灵笔内容引擎:     前端 3002  后端 8202
#   ③ 视界短视频工坊:   前端 3000  后端 8000
#   ④ 图库资产管家(DAM): 前端 3004  后端 8400
#   ⑤ 话术对战教练:     前端 3005  后端 8505
#   ⑥ 数据中枢:         前端 3006  后端 8606
#   ⑦ 智能运营引擎:     前端 3007  后端 8707
#   ⑧ 模型定制工厂:     前端 3008  后端 8808
#   共享 PostgreSQL:     5432 (仅容器内)
# ============================================================

services:

  # ═══════════════════════════════════════════════════════
  # 共享基础设施 — PostgreSQL（3个项目共用，分3个数据库）
  # ═══════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ai-projects-2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════
  # ① 智能客服助手
  # ═══════════════════════════════════════════════════════
  p1-backend:
    build:
      context: ./01-RAG智能客服系统/backend
      dockerfile: Dockerfile
    container_name: p1-backend
    env_file: ./01-RAG智能客服系统/backend/.env.docker
    ports:
      - "8101:8000"
    volumes:
      - p1_uploads:/app/data/uploads
      - p1_chroma:/app/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # 手动启动，不开机自启

  p1-frontend:
    build:
      context: ./01-RAG智能客服系统/frontend
      dockerfile: Dockerfile
    container_name: p1-frontend
    ports:
      - "3001:5173"
    volumes:
      - ./01-RAG智能客服系统/frontend/src:/app/src:ro
      - ./01-RAG智能客服系统/frontend/public:/app/public:ro
      - ./01-RAG智能客服系统/frontend/index.html:/app/index.html:ro
      - ./01-RAG智能客服系统/frontend/vite.config.ts:/app/vite.config.ts:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p1-backend:8000
    depends_on:
      - p1-backend
    restart: "no"  # 手动启动，不开机自启

  # ═══════════════════════════════════════════════════════
  # ② 灵笔内容引擎
  # ═══════════════════════════════════════════════════════
  p2-backend:
    build:
      context: ./02-AI自媒体内容助手/backend
      dockerfile: Dockerfile
    container_name: p2-backend
    env_file: ./02-AI自媒体内容助手/backend/.env.docker
    ports:
      - "8202:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # 手动启动，不开机自启

  p2-frontend:
    build:
      context: ./02-AI自媒体内容助手/frontend
      dockerfile: Dockerfile
    container_name: p2-frontend
    ports:
      - "3002:5173"
    volumes:
      - ./02-AI自媒体内容助手/frontend/src:/app/src:ro
      - ./02-AI自媒体内容助手/frontend/public:/app/public:ro
      - ./02-AI自媒体内容助手/frontend/index.html:/app/index.html:ro
      - ./02-AI自媒体内容助手/frontend/vite.config.ts:/app/vite.config.ts:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p2-backend:8000
    depends_on:
      - p2-backend
    restart: "no"  # 手动启动，不开机自启

  # ═══════════════════════════════════════════════════════
  # ③ 视界短视频工坊
  # ═══════════════════════════════════════════════════════
  p3-backend:
    build:
      context: ./03-AI短视频脚本工坊/backend
      dockerfile: Dockerfile
    container_name: p3-backend
    env_file: ./03-AI短视频脚本工坊/backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # 手动启动，不开机自启

  p3-frontend:
    build:
      context: ./03-AI短视频脚本工坊/frontend
      dockerfile: Dockerfile
    container_name: p3-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./03-AI短视频脚本工坊/frontend/src:/app/src:ro
      - ./03-AI短视频脚本工坊/frontend/public:/app/public:ro
      - ./03-AI短视频脚本工坊/frontend/index.html:/app/index.html:ro
      - ./03-AI短视频脚本工坊/frontend/vite.config.ts:/app/vite.config.ts:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p3-backend:8000
    depends_on:
      - p3-backend
    restart: "no"  # 手动启动，不开机自启

  # ═══════════════════════════════════════════════════════
  # ④ 图库资产管家 (B端)
  # 端口: 前端3004 后端8400  数据库: postgres/assetmgmt
  # ═══════════════════════════════════════════════════════
  p4-backend:
    build:
      context: ./04-AI素材管理平台/backend
      dockerfile: Dockerfile
    container_name: p4-backend
    env_file: ./04-AI素材管理平台/backend/.env.docker
    ports:
      - "8400:8000"
    volumes:
      - p4_uploads:/app/data/uploads
      - ./04-AI素材管理平台/backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  p4-frontend:
    build:
      context: ./04-AI素材管理平台/frontend
      dockerfile: Dockerfile
    container_name: p4-frontend
    ports:
      - "3004:5173"
    volumes:
      - ./04-AI素材管理平台/frontend/src:/app/src:ro
      - ./04-AI素材管理平台/frontend/public:/app/public:ro
      - ./04-AI素材管理平台/frontend/index.html:/app/index.html:ro
      - ./04-AI素材管理平台/frontend/vite.config.ts:/app/vite.config.ts:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p4-backend:8000
    depends_on:
      - p4-backend
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════
  # ⑤ 话术对战教练 (B端)
  # 端口: 前端3005 后端8505  数据库: postgres/salestraining
  # ═══════════════════════════════════════════════════════
  p5-backend:
    build:
      context: ./05-AI销售培训系统/backend
      dockerfile: Dockerfile
    container_name: p5-backend
    env_file: ./05-AI销售培训系统/backend/.env.docker
    ports:
      - "8505:8000"
    volumes:
      - p5_uploads:/app/data/uploads
      - ./05-AI销售培训系统/backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  p5-frontend:
    build:
      context: ./05-AI销售培训系统/frontend
      dockerfile: Dockerfile
    container_name: p5-frontend
    ports:
      - "3005:5173"
    volumes:
      - ./05-AI销售培训系统/frontend/src:/app/src:ro
      - ./05-AI销售培训系统/frontend/public:/app/public:ro
      - ./05-AI销售培训系统/frontend/index.html:/app/index.html:ro
      - ./05-AI销售培训系统/frontend/vite.config.ts:/app/vite.config.ts:ro
      - p5_vite_cache:/app/node_modules/.vite
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p5-backend:8000
    depends_on:
      p5-backend:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════
  # ⑥ 数据中枢 (中台)
  # 端口: 前端3006 后端8606  数据库: postgres/datacenter
  # ═══════════════════════════════════════════════════════
  p6-backend:
    build:
      context: ./06-AI数据中心平台/backend
      dockerfile: Dockerfile
    container_name: p6-backend
    env_file: ./06-AI数据中心平台/backend/.env.docker
    ports:
      - "8606:8000"
    volumes:
      - p6_uploads:/app/data/uploads
      - ./06-AI数据中心平台/backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  p6-frontend:
    build:
      context: ./06-AI数据中心平台/frontend
      dockerfile: Dockerfile
    container_name: p6-frontend
    ports:
      - "3006:5173"
    volumes:
      - ./06-AI数据中心平台/frontend/src:/app/src:ro
      - ./06-AI数据中心平台/frontend/public:/app/public:ro
      - ./06-AI数据中心平台/frontend/index.html:/app/index.html:ro
      - ./06-AI数据中心平台/frontend/vite.config.ts:/app/vite.config.ts:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p6-backend:8000
    depends_on:
      p6-backend:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════
  # ⑦ 智能运营引擎 (中台)
  # 端口: 前端3007 后端8707  数据库: postgres/agentplatform
  # ═══════════════════════════════════════════════════════
  p7-backend:
    build:
      context: ./07-MCP多智能体协作平台/backend
      dockerfile: Dockerfile
    container_name: p7-backend
    env_file: ./07-MCP多智能体协作平台/backend/.env.docker
    ports:
      - "8707:8000"
    volumes:
      - p7_uploads:/app/data/uploads
      - ./07-MCP多智能体协作平台/backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  p7-frontend:
    build:
      context: ./07-MCP多智能体协作平台/frontend
      dockerfile: Dockerfile
    container_name: p7-frontend
    ports:
      - "3007:5173"
    volumes:
      - ./07-MCP多智能体协作平台/frontend/src:/app/src:ro
      - ./07-MCP多智能体协作平台/frontend/public:/app/public:ro
      - ./07-MCP多智能体协作平台/frontend/index.html:/app/index.html:ro
      - ./07-MCP多智能体协作平台/frontend/vite.config.ts:/app/vite.config.ts:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p7-backend:8000
    depends_on:
      p7-backend:
        condition: service_healthy
    restart: unless-stopped

  # p8-backend (8808) + p8-frontend (3008) — 模型定制工厂
  p8-backend:
    build:
      context: ./08-AI模型微调训练平台/backend
      dockerfile: Dockerfile
    container_name: p8-backend
    env_file: ./08-AI模型微调训练平台/backend/.env.docker
    ports:
      - "8808:8000"
    volumes:
      - p8_uploads:/app/data/uploads
      - ./08-AI模型微调训练平台/backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  p8-frontend:
    build:
      context: ./08-AI模型微调训练平台/frontend
      dockerfile: Dockerfile
    container_name: p8-frontend
    ports:
      - "3008:5173"
    volumes:
      - ./08-AI模型微调训练平台/frontend/src:/app/src:ro
      - ./08-AI模型微调训练平台/frontend/public:/app/public:ro
      - ./08-AI模型微调训练平台/frontend/index.html:/app/index.html:ro
      - ./08-AI模型微调训练平台/frontend/vite.config.ts:/app/vite.config.ts:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      - VITE_BACKEND_URL=http://p8-backend:8000
    depends_on:
      p8-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  p4_uploads:
  p5_uploads:
  p5_vite_cache:
  p6_uploads:
  p7_uploads:
  p8_uploads:
  p1_uploads:
  p1_chroma:
