name: AI中台 — 代码审查 + 测试

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # 手动触发

jobs:
  # ─── Python 后端检查 ───────────────────────────
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: |
          for dir in 0[1-8]-*/backend; do
            echo "=== $dir ==="
            ruff check "$dir" --output-format=github || true
          done

  # ─── 后端单元测试 ──────────────────────────────
  python-test:
    name: Python (pytest)
    runs-on: ubuntu-latest
    needs: python-lint
    strategy:
      matrix:
        project: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Find project dir
        id: dir
        run: |
          DIR=$(ls -d 0${{ matrix.project }}-*/backend)
          echo "path=$DIR" >> "$GITHUB_OUTPUT"
      - run: pip install -r requirements.txt
        working-directory: ${{ steps.dir.outputs.path }}
      - run: pip install pytest pytest-asyncio aiosqlite pytest-timeout httpx
      - run: python -m pytest tests/ -q --tb=short
        working-directory: ${{ steps.dir.outputs.path }}
        env:
          ADMIN_PASSWORD: test123
          MOCK_LLM: "1"

  # ─── 前端类型检查 ──────────────────────────────
  frontend-check:
    name: Frontend (vue-tsc)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find project dir
        id: dir
        run: |
          DIR=$(ls -d 0${{ matrix.project }}-*/frontend)
          echo "path=$DIR" >> "$GITHUB_OUTPUT"
      - run: npm install
        working-directory: ${{ steps.dir.outputs.path }}
      - run: npx vue-tsc --noEmit
        working-directory: ${{ steps.dir.outputs.path }}

  # ─── 安全扫描 ──────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          echo "=== 扫描硬编码密钥 ==="
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.ts" --include="*.env*" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=__pycache__ \
              --exclude-dir=chroma --exclude-dir=data . 2>/dev/null; then
            echo "::error::发现硬编码 API Key"
            exit 1
          fi
          echo "未发现硬编码密钥"
